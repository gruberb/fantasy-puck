app = 'fantasy-puck-api'
primary_region = 'yyz'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Off-season setting. A suspended machine only wakes on inbound HTTP,
  # so the 60s live poller and the wall-clock crons (rankings/prewarm/edge)
  # will NOT fire while the machine is idle. That is fine outside the season
  # window — those jobs self-skip past NHL_SEASON_END anyway. Before the next
  # season starts, set this back to 'off' with min_machines_running = 1 so
  # live polling and the daily crons run continuously.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
